# Base de datos H2 en memoria (los datos se borran al parar la aplicación)
spring.datasource.url=jdbc:h2:mem:clinica;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Las tablas se crean con schema.sql y los datos con data.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Ejecutar schema.sql y data.sql en cada arranque
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Consola de la base de datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true

server.port=8080

# Mensajes de error visibles en la página de error
server.error.include-message=always
server.error.include-binding-errors=always
