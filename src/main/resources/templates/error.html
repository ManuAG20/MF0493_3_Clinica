<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · Clínica Salud</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <div class="marca">Clínica Salud</div>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/pacientes}">Pacientes</a>
        <a th:href="@{/citas}">Citas</a>
    </nav>
</header>

<main class="contenedor">
    <section class="pagina-error">
        <div class="codigo" th:text="${status != null ? status : 500}">500</div>
        <h1 th:text="${error != null ? error : 'Error'}">Error</h1>
        <p th:text="${message != null and !#strings.isEmpty(message) ? message : 'Ha ocurrido un error. Vuelve al inicio e inténtalo de nuevo.'}">
            Ha ocurrido un error. Vuelve al inicio e inténtalo de nuevo.
        </p>
        <a class="boton" th:href="@{/}">Volver al inicio</a>
    </section>
</main>

<footer>MF0493_3 · Implantación de aplicaciones web · Hazerta</footer>
</body>
</html>
